<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2º MTEC Contabilidade - Mairinque</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--ink:#262626;--muted:#666;--accent:#b5121b;--accent-dark:#8f0e15;--border:#dedede}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;padding:42px 20px;border-bottom:6px solid #6d6e71}.wrap{max-width:1050px;margin:auto}h1{margin:0 0 8px;font-size:clamp(28px,4vw,44px)}header p{margin:0;opacity:.95}.institution{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;opacity:.92}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;padding:30px 20px}.card{background:var(--card);border:1px solid var(--border);border-top:5px solid var(--accent);border-radius:10px;padding:24px;box-shadow:0 6px 18px rgba(0,0,0,.06)}.card h2{margin-top:0;color:var(--accent)}.btn{display:inline-block;margin-top:12px;padding:11px 17px;border-radius:7px;text-decoration:none;background:var(--accent);color:#fff;font-weight:700}.btn:hover{background:var(--accent-dark)}footer{padding:22px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--border);background:#fff}
</style>
</head>
<body>
<header><div class="wrap"><div class="institution">Centro Paula Souza • Etec de Mairinque</div><h1>2º MTEC – Contabilidade</h1><p>Portal da turma</p></div></header>
<main class="wrap grid">
<section class="card"><h2>LTP</h2><p><strong>Legislação Trabalhista Empresarial</strong></p><p>Materiais de apoio, atividades do semestre, prazos e orientações.</p><a class="btn" href="ltp/">Acessar componente</a></section>
</main>
<footer>Prof. Junior Colombo • Etec de Mairinque • 2026</footer>
</body>
</html>
