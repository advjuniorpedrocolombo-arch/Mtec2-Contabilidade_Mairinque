<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Painel do Professor - LTP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#142f52;color:white;padding:28px 20px}.wrap{max-width:980px;margin:auto}.card{background:#fff;border:1px solid #dde6f0;border-radius:16px;padding:22px;margin:22px 20px;box-shadow:0 8px 22px rgba(20,45,80,.06)}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7e5;border-radius:9px;font:inherit}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{margin-top:18px;background:#193b67;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.hint{color:#66758b;font-size:14px}.ok{background:#e8f6ef;border:1px solid #9fd3b8;padding:12px;border-radius:10px;margin-top:14px}.warn{background:#fff6dc;border:1px solid #ead27a;padding:12px;border-radius:10px;margin-top:14px}</style></head><body><header><div class="wrap"><h1>Painel do Professor – LTP</h1><p>2º MTEC – Contabilidade • Mairinque</p></div></header><main class="wrap"><section class="card"><h2>Nova atividade</h2><p class="hint">Cadastre a atividade uma vez. A página dos alunos usa este cadastro automaticamente.</p><form id="f"><div class="grid"><div><label>ID da atividade</label><input name="id" placeholder="LTP-ATD1" required></div><div><label>Status</label><select name="status"><option>RASCUNHO</option><option>PUBLICADA</option></select></div></div><label>Título</label><input name="titulo" placeholder="ATD1 – Contrato de Trabalho" required><label>Descrição</label><textarea name="descricao" placeholder="Descrição curta da atividade"></textarea><label>Orientações</label><textarea name="orientacoes" placeholder="Instruções completas para os alunos"></textarea><div class="grid"><div><label>Tipo de envio</label><select name="tipoEnvio"><option value="FOTOS">Fotos/imagens</option><option value="PDF">PDF</option><option value="WORD">Word</option><option value="EXCEL">Excel</option><option value="ARQUIVO">Arquivo genérico</option><option value="FORMULARIO">Resposta na página</option><option value="SEM_ENVIO">Sem envio</option></select></div><div><label>Máximo de arquivos</label><input name="maxArquivos" type="number" min="0" value="5"></div><div><label>Prazo</label><input name="prazo" type="date"></div></div><label>Link de material/arquivo de apoio</label><input name="materialUrl" type="url" placeholder="https://..."><label><input style="width:auto;display:inline-block" name="correcaoIA" type="checkbox" value="SIM"> Permitir correção por IA</label><button class="btn" type="submit">Publicar / salvar atividade</button></form><div id="msg" class="warn">Painel pronto. Para gravar de verdade, falta apenas conectar a planilha central ao Apps Script.</div></section></main><script src="../config.js"></script><script>const cfg=window.PORTAL_CONFIG||{};document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');if(!cfg.apiUrl){msg.className='warn';msg.textContent='A atividade ainda não foi gravada: falta configurar a URL do Apps Script em config.js.';return}const data=Object.fromEntries(new FormData(e.target).entries());data.action='salvarAtividade';data.turma=cfg.turma;data.componente=cfg.componente;data.correcaoIA=e.target.correcaoIA.checked?'SIM':'NAO';try{const r=await fetch(cfg.apiUrl,{method:'POST',body:JSON.stringify(data)});const j=await r.json();if(!j.ok)throw new Error(j.erro||'Falha');msg.className='ok';msg.textContent='Atividade salva com sucesso.';e.target.reset()}catch(err){msg.className='warn';msg.textContent='Erro ao salvar: '+err.message}});</script></body></html>
