<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Professor - LTP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#142f52;color:#fff;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dde6f0;border-radius:16px;padding:20px;margin:20px 0;box-shadow:0 8px 22px rgba(20,45,80,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd7e5;border-radius:9px;font:inherit}textarea{min-height:90px}.btn{background:#193b67;color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;margin-top:14px}.muted{color:#65748b}.item{border:1px solid #dfe7f1;border-radius:12px;padding:14px;margin:10px 0}.tag{display:inline-block;background:#eef4fb;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:6px}.ok{background:#e8f6ef;border:1px solid #9fd3b8;padding:10px;border-radius:10px;margin-top:12px}.warn{background:#fff6dc;border:1px solid #ead27a;padding:10px;border-radius:10px;margin-top:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:9px 12px;border:1px solid #cbd7e5;background:#fff;border-radius:999px;cursor:pointer}.tabs button.active{background:#193b67;color:#fff}</style></head><body><header><div class="wrap"><h1>Painel do Professor – LTP</h1><div>2º MTEC – Contabilidade • Mairinque</div></div></header><main class="wrap"><section class="card"><div class="tabs"><button class="active" data-tab="cadastro">Atividades</button><button data-tab="entregas">Entregas</button></div><div id="cadastro"><h2>Nova atividade / editar atividade</h2><form id="f"><div class="grid"><div><label>ID</label><input name="id" placeholder="LTP-ATD2" required></div><div><label>Status</label><select name="status"><option>RASCUNHO</option><option>PUBLICADA</option><option>OCULTA</option><option>ENCERRADA</option></select></div><div><label>Ordem</label><input name="ordem" type="number" min="1" value="1"></div></div><label>Título</label><input name="titulo" required><label>Descrição</label><textarea name="descricao"></textarea><div class="grid"><div><label>Tipo de envio</label><select id="tipoEnvio" name="tipoEnvio"><option value="FOTOS">Fotos/imagens</option><option value="PDF">PDF</option><option value="WORD">Word</option><option value="EXCEL">Excel</option><option value="ARQUIVO">Arquivo genérico</option><option value="FORMULARIO">Resposta escrita</option><option value="SEM_ENVIO">Sem envio</option></select></div><div><label>Extensões permitidas</label><input id="extensoes" name="extensoes" value="jpg,jpeg,png,webp"></div><div><label>Máximo de arquivos</label><input name="maxArquivos" type="number" value="5"></div><div><label>Prazo</label><input name="prazo" type="date"></div></div><label>Material de apoio</label><input name="materialUrl" type="url" placeholder="https://..."><label>Gabarito / critérios de correção</label><textarea name="criterios"></textarea><label><input style="width:auto" type="checkbox" name="correcaoIA" value="SIM"> Correção por IA</label><button class="btn" type="submit">Salvar atividade</button></form><div id="msg"></div><h3>Atividades cadastradas</h3><div id="listaAtividades" class="muted">Carregando...</div></div><div id="entregas" style="display:none"><h2>Entregas dos alunos</h2><label>Filtrar por atividade</label><select id="filtroAtividade"><option value="">Todas</option></select><div id="listaEntregas" class="muted">Carregando...</div></div></section></main><script>const defaults={FOTOS:'jpg,jpeg,png,webp',PDF:'pdf',WORD:'doc,docx',EXCEL:'xls,xlsx,xlsm,xltm',ARQUIVO:'pdf,doc,docx,xls,xlsx,xlsm,xltm,ppt,pptx,jpg,jpeg,png,webp',FORMULARIO:'',SEM_ENVIO:''};const $=s=>document.querySelector(s);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#cadastro').style.display=b.dataset.tab==='cadastro'?'block':'none';$('#entregas').style.display=b.dataset.tab==='entregas'?'block':'none';if(b.dataset.tab==='entregas')carregarEntregas()});$('#tipoEnvio').onchange=e=>$('#extensoes').value=defaults[e.target.value]||'';function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function preencher(a){const f=$('#f');['id','titulo','descricao','tipoEnvio','extensoes','maxArquivos','prazo','materialUrl','criterios','status','ordem'].forEach(k=>{if(f.elements[k])f.elements[k].value=a[k]??''});f.elements.correcaoIA.checked=a.correcaoIA==='SIM';scrollTo({top:0,behavior:'smooth'})}function carregarAtividades(){google.script.run.withSuccessHandler(lista=>{window.atividades=lista||[];$('#listaAtividades').innerHTML=lista.length?lista.map(a=>`<div class="item"><span class="tag">${esc(a.status)}</span><span class="tag">${esc(a.tipoEnvio)}</span><strong>${esc(a.titulo)}</strong><div class="muted">${esc(a.id)}</div><button class="btn" onclick='preencher(${JSON.stringify(a)})'>Editar</button></div>`).join(''):'Nenhuma atividade.';$('#filtroAtividade').innerHTML='<option value="">Todas</option>'+lista.map(a=>`<option value="${esc(a.id)}">${esc(a.titulo)}</option>`).join('')}).listarAtividades()}$('#f').onsubmit=e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f).entries());d.correcaoIA=f.elements.correcaoIA.checked?'SIM':'NAO';$('#msg').className='warn';$('#msg').textContent='Salvando...';google.script.run.withSuccessHandler(r=>{$('#msg').className='ok';$('#msg').textContent='Atividade salva: '+r.id;carregarAtividades()}).withFailureHandler(err=>{$('#msg').className='warn';$('#msg').textContent='Erro: '+err.message}).salvarAtividade(d)};function carregarEntregas(){const id=$('#filtroAtividade').value;$('#listaEntregas').textContent='Carregando...';google.script.run.withSuccessHandler(lista=>{$('#listaEntregas').innerHTML=lista.length?lista.map(e=>`<div class="item"><strong>${esc(e.aluno||'Sem nome')}</strong><div>${esc(e.idAtividade)}</div><div class="muted">${esc(e.email||'')} • ${esc(e.status||'')}</div>${e.arquivos?`<div><a href="${esc(e.arquivos)}" target="_blank">Abrir arquivos</a></div>`:''}${e.resposta?`<p>${esc(e.resposta)}</p>`:''}</div>`).join(''):'Nenhuma entrega encontrada.'}).listarEntregas(id)}$('#filtroAtividade').onchange=carregarEntregas;carregarAtividades();</script></body></html>
