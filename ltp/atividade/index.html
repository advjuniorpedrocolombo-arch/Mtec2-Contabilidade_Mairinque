<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Atividade - LTP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}header{background:#193b67;color:white}.card{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(20,45,80,.06)}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#eef4fb;padding:6px 10px;border-radius:999px;font-size:14px}.btn{display:inline-block;background:#193b67;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700;text-decoration:none;cursor:pointer}.muted{color:#65748b}.upload{margin-top:22px;padding-top:18px;border-top:1px solid #e1e8f1}input{display:block;margin:10px 0 14px;width:100%;padding:10px;border:1px solid #cfd9e7;border-radius:8px}.notice{background:#fff7dc;border:1px solid #f0d77a;padding:12px;border-radius:10px}</style></head><body><header><div class="wrap"><a href="../" style="color:white;text-decoration:none">← Atividades de LTP</a></div></header><main class="wrap"><div id="conteudo" class="card">Carregando atividade...</div></main><script src="../../config.js"></script><script>
const cfg=window.PORTAL_CONFIG||{};const id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(a){const tipos={FOTOS:'Fotos/imagens',PDF:'PDF',WORD:'Word',EXCEL:'Excel',ARQUIVO:'Arquivo',FORMULARIO:'Resposta na página',SEM_ENVIO:'Sem envio'};let html=`<div class="meta"><span class="tag">${esc(tipos[a.tipoEnvio]||a.tipoEnvio||'Sem envio')}</span>${a.prazo?`<span class="tag">Entrega: ${new Date(a.prazo+'T12:00:00').toLocaleDateString('pt-BR')}</span>`:''}</div><h1>${esc(a.titulo)}</h1><p>${esc(a.descricao||'')}</p>${a.orientacoes?`<h3>Orientações</h3><p>${esc(a.orientacoes)}</p>`:''}${a.materialUrl?`<a class="btn" href="${esc(a.materialUrl)}" target="_blank" rel="noopener">Material da atividade</a>`:''}`;
if(a.tipoEnvio&&a.tipoEnvio!=='SEM_ENVIO'){html+=`<div class="upload"><h3>Entrega</h3><p class="muted">Tipo permitido: <strong>${esc(tipos[a.tipoEnvio]||a.tipoEnvio)}</strong>${a.maxArquivos?` • Máximo: ${esc(a.maxArquivos)} arquivo(s)`:''}</p><div class="notice">O envio será habilitado assim que esta atividade estiver conectada ao banco central do professor.</div></div>`}document.getElementById('conteudo').innerHTML=html}
async function load(){if(!id){document.getElementById('conteudo').innerHTML='Atividade não informada.';return}if(!cfg.apiUrl){document.getElementById('conteudo').innerHTML='<h1>Atividade ainda não publicada</h1><p>A estrutura já está pronta; falta conectar o banco central.</p>';return}try{const u=new URL(cfg.apiUrl);u.searchParams.set('action','atividade');u.searchParams.set('id',id);const r=await fetch(u);const d=await r.json();if(!d.atividade)throw 0;render(d.atividade)}catch(e){document.getElementById('conteudo').innerHTML='Não foi possível carregar esta atividade.'}}load();
</script></body></html>
